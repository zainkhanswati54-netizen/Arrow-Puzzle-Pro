name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # needed to create the GitHub Release

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::No KEYSTORE_BASE64 secret set — building with the debug key."
          echo "::warning::This APK is installable for testing but cannot go to Play."

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Collect outputs
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk "artifacts/arrow-puzzle-${VERSION}.apk"
          cp app/build/outputs/bundle/release/*.aab "artifacts/arrow-puzzle-${VERSION}.aab" || true
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-puzzle-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
